# Optional local Kubernetes deployment. Does not require a GPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-quality-lab
  labels: {app: agent-quality-lab}
spec:
  replicas: 2
  selector:
    matchLabels: {app: agent-quality-lab}
  template:
    metadata:
      labels: {app: agent-quality-lab}
    spec:
      containers:
        - name: api
          image: agentic-quality-reliability-lab:local
          imagePullPolicy: IfNotPresent
          env:
            - {name: AQ_MODE, value: deterministic}
            - {name: AQ_ENABLE_FAULTS, value: '0'}
          ports:
            - {containerPort: 8000}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-quality-lab
spec:
  selector: {app: agent-quality-lab}
  ports:
    - {port: 8000, targetPort: 8000}
