# Optional GPU-host variant. Use only after bringing up accelerator DCGM Exporter
# at a network address reachable from Prometheus (default exporter port 9400).
# On Apple Silicon there is no accelerator GPU / DCGM exporter to scrape.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: agent-quality-lab
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']
  - job_name: dcgm-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:9400']
