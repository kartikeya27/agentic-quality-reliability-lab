services:
  app:
    build: .
    environment:
      AQ_MODE: ${AQ_MODE:-deterministic}
      AQ_MODEL: ${AQ_MODEL:-llama3.2:1b}
      AQ_OLLAMA_URL: ${AQ_OLLAMA_URL:-http://host.docker.internal:11434}
      AQ_OPENAI_BASE_URL: ${AQ_OPENAI_BASE_URL:-http://host.docker.internal:8001/v1}
      AQ_API_KEY: ${AQ_API_KEY:-}
      AQ_NIM_BASE_URL: ${AQ_NIM_BASE_URL:-http://host.docker.internal:8001/v1}
      AQ_NIM_MODEL: ${AQ_NIM_MODEL:-llama3.2:1b}
      AQ_NIM_API_KEY: ${AQ_NIM_API_KEY:-}
      AQ_ARTIFACT_DIR: artifacts
      AQ_ENABLE_FAULTS: '0'
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - '127.0.0.1:8000:8000'
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
    depends_on: [app]
  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3000:3000'
    depends_on: [prometheus]
