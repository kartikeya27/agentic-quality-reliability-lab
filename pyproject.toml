[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-quality-reliability-lab"
version = "0.5.0"
description = "Reproducible AI agent testing, reliability, and observability engineering lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "httpx>=0.26,<1.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
nemo = ["nemoguardrails>=0.22,<1"]

[project.scripts]
agent-quality = "agent_quality_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["agent_quality_lab"]
